version: 2

project_name: saw

before:
  hooks:
    - go mod download

builds:
  - id: saw
    binary: saw
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # darwin dropped 32-bit arm long ago
      - goos: darwin
        goarch: arm

archives:
  - id: saw
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

nfpms:
  - id: saw
    package_name: saw
    vendor: Lincoln Loop
    homepage: https://github.com/apppackio/saw
    maintainer: Peter Baumgartner <pete@lincolnloop.com>
    description: Fast, multipurpose tool for AWS CloudWatch Logs
    license: MIT
    formats:
      - deb
      - rpm

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: apppackio
    name: saw

homebrew_casks:
  - name: saw
    repository:
      owner: apppackio
      name: homebrew-saw
      # The default GITHUB_TOKEN only reaches this repo, so publishing to
      # the tap needs a PAT with contents:write on apppackio/homebrew-saw.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/apppackio/saw
    description: Fast, multipurpose tool for AWS CloudWatch Logs
    license: MIT
    commit_author:
      name: apppack-bot
      email: noreply@apppack.io
    hooks:
      post:
        # The release binaries are unsigned, so macOS quarantines them and
        # Gatekeeper refuses to run them. Strip the attribute on install.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/saw"]
          end
